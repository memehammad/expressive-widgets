name: Render widgets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || true
            adb pull /sdcard/Android/data/dev.memehammad.widgets/files/renders renders || true
            adb shell cmd uimode night yes; ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || true
            mkdir -p renders_night; adb pull /sdcard/Android/data/dev.memehammad.widgets/files/renders renders_night || true
      - name: Push renders to the "renders" branch
        run: |
          mkdir -p out && cp -r renders renders_night out/ 2>/dev/null || true
          cd out
          git init -q -b renders
          git config user.name "render bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Renders ${{ github.sha }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" renders
