name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (optional SIGNING_KEY secret, base64 of release.jks)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then echo "$SIGNING_KEY" | base64 -d > app/release.jks; fi

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ExpressiveWidgets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ExpressiveWidgets
          path: ExpressiveWidgets.apk

      - name: Release notes (newest section of CHANGELOG.md)
        run: |
          awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Publish release (download the APK here from your phone)
        uses: softprops/action-gh-release@v2
        with:
          # Tag matches the app's versionName (1.0.<run>) so Obtainium can detect updates.
          tag_name: v0.1.${{ github.run_number }}
          name: Expressive Widgets 0.1.${{ github.run_number }}
          make_latest: true
          body_path: release_notes.md
          files: ExpressiveWidgets.apk
